name: Release pigment-lsp

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pigment-lsp-linux-amd64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pigment-lsp-linux-arm64.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: pigment-lsp-darwin-amd64.tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: pigment-lsp-darwin-arm64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pigment-lsp-windows-amd64.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: pigment-lsp-windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package pigment-lsp --target ${{ matrix.target }}
      - name: Verify binary
        shell: bash
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/pigment-lsp --version
      - name: Verify binary
        shell: pwsh
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/pigment-lsp.exe --version
      - name: Package archive
        shell: bash
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }} pigment-lsp
      - name: Package archive
        shell: pwsh
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/pigment-lsp.exe -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum pigment-lsp-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
